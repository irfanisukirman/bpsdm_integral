<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><g font-family="DejaVu Sans"><rect x="126" y="157" width="788" height="78" fill="#ffbf00"/><circle cx="126" cy="196" r="50" fill="white" stroke="#ffbf00"/><text x="126" y="210" text-anchor="middle" font-size="36">1</text><text x="190" y="188" font-size="23" fill="white">Mengetahui pencapaian target jangka menengah dan</text><text x="190" y="219" font-size="23" fill="white">jangka panjang tiap proyek perubahan</text><rect x="155" y="276" width="759" height="78" fill="#24db32"/><circle cx="155" cy="315" r="50" fill="white" stroke="#24db32"/><text x="155" y="329" text-anchor="middle" font-size="36">2</text><text x="218" y="307" font-size="23" fill="white">Mengetahui keberlanjutan proyek perubahan ketika</text><text x="218" y="338" font-size="23" fill="white">terjadi suksesi kepemimpinan</text><rect x="126" y="395" width="788" height="78" fill="#609ed5"/><circle cx="126" cy="434" r="50" fill="white" stroke="#609ed5"/><text x="126" y="448" text-anchor="middle" font-size="36">3</text><text x="190" y="426" font-size="23" fill="white">Mengetahui dampak nyata proyek perubahan bagi</text><text x="190" y="457" font-size="23" fill="white">masyarakat</text></g></svg>
